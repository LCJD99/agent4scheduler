[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.1,<2",
    "openai>=2.20,<3",
    "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
