api_version: sim.scenario/v1
kind: ScenarioSpec

metadata:
  name: home_eqa_scenario_001
  description: Mixed critical and agent workload scenario.

tick_us: 1000
duration_us: 100000
system_capacity:
  cpu_cores: 4.0
  memory_mb: 4096
  network_mbps: 100.0

tasks:
